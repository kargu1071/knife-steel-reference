name: Bicak Atlasi - Cloudflare and Netlify

on:
  pull_request:
    paths:
      - 'bicak-atlasi/deploy/**'
      - 'bicak-atlasi/render/public/**'
      - '.github/workflows/bicak-atlasi-hosting.yml'
  push:
    branches: [main]
    paths:
      - 'bicak-atlasi/deploy/**'
      - 'bicak-atlasi/render/public/**'
      - '.github/workflows/bicak-atlasi-hosting.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bicak-atlasi-hosting-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check deployment builder and static pages
        run: |
          node --check bicak-atlasi/deploy/prepare.mjs
          node bicak-atlasi/deploy/prepare.mjs cloudflare
          test -s .atlas-dist/index.html
          test -s .atlas-dist/karsilastir/index.html
          test -s .atlas-dist/sitemap.xml

  cloudflare:
    needs: verify
    if: ${{ github.event_name != 'pull_request' && vars.ATLAS_CLOUDFLARE_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Prepare Cloudflare Pages output
        run: node bicak-atlasi/deploy/prepare.mjs cloudflare
      - name: Deploy to EXISTING Cloudflare Pages project
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.ATLAS_CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.ATLAS_CF_ACCOUNT_ID }}
          CF_PROJECT: ${{ vars.ATLAS_CF_PROJECT }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" && test -n "$CLOUDFLARE_ACCOUNT_ID" && test -n "$CF_PROJECT" || { echo 'Missing Cloudflare configuration'; exit 1; }
          npx --yes wrangler@4 pages deploy .atlas-dist --project-name="$CF_PROJECT" --branch=main

  netlify:
    needs: verify
    if: ${{ github.event_name != 'pull_request' && vars.ATLAS_NETLIFY_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Prepare Netlify output (noindex secondary host)
        run: node bicak-atlasi/deploy/prepare.mjs netlify
      - name: Deploy to EXISTING Netlify site
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.ATLAS_NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.ATLAS_NETLIFY_SITE_ID }}
        run: |
          test -n "$NETLIFY_AUTH_TOKEN" && test -n "$NETLIFY_SITE_ID" || { echo 'Missing Netlify configuration'; exit 1; }
          npx --yes netlify-cli deploy --prod --dir=.atlas-dist --site="$NETLIFY_SITE_ID"
